<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGENTS RADAR — Intelligence Briefing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=IBM+Plex+Mono:wght@300;400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="alternate" type="application/rss+xml" title="agents-radar RSS" href="./feed.xml">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
:root {
  --ink: #0a0a0f;
  --surface: #111118;
  --surface-2: #18181f;
  --surface-3: #1f1f28;
  --border: #2a2a35;
  --border-hi: #3a3a48;
  --cream: #e8e4dc;
  --cream-dim: #b8b4ac;
  --muted: #7a7680;
  --faint: #4a4650;
  --gold: #c8a44e;
  --gold-dim: rgba(200,164,78,0.12);
  --gold-glow: rgba(200,164,78,0.25);
  --signal: #4ecdc4;
  --signal-dim: rgba(78,205,196,0.1);
  --red: #e85d5d;
  --blue: #6b9fd4;
  --purple: #a78bda;
  --green: #6bcb77;
  --pink: #d4789b;
  --orange: #d4915e;
  --cyan: #5ec4c4;
  --serif: 'Playfair Display', Georgia, 'Songti SC', serif;
  --mono: 'IBM Plex Mono', 'Menlo', monospace;
  --body: 'Source Serif 4', Georgia, 'Songti SC', serif;
}
[data-theme="light"] {
  --ink: #f6f4f0;
  --surface: #ffffff;
  --surface-2: #f0eee9;
  --surface-3: #e8e5df;
  --border: #d8d4cc;
  --border-hi: #c0bbb2;
  --cream: #1a1814;
  --cream-dim: #4a4640;
  --muted: #7a756c;
  --faint: #b0aaa0;
  --gold: #8b6914;
  --gold-dim: rgba(139,105,20,0.08);
  --gold-glow: rgba(139,105,20,0.15);
  --signal: #1a7a72;
  --signal-dim: rgba(26,122,114,0.08);
  --red: #b83a3a;
  --blue: #3a6a9a;
  --purple: #6a4a9a;
  --green: #3a7a4a;
  --pink: #9a4a6a;
  --orange: #9a6a3a;
  --cyan: #3a7a7a;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
  height: 100%; overflow: hidden;
  font-family: var(--body);
  background: var(--ink);
  color: var(--cream);
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--gold-dim); color: var(--gold); }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: var(--faint); }

#app { display: grid; grid-template-rows: auto 1fr; grid-template-columns: 300px 1fr; height: 100vh; }
#hdr { grid-column: 1 / -1; }
#sidebar { grid-row: 2; overflow: hidden; display: flex; flex-direction: column; }
#main { grid-row: 2; overflow-y: auto; position: relative; }

/* ═══ HEADER ═══ */
#hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px; height: 56px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  position: relative; z-index: 200;
}
#hdr::after {
  content: ''; position: absolute; bottom: -1px; left: 28px; width: 120px; height: 1px;
  background: var(--gold);
}
.brand {
  font-family: var(--mono); font-size: 11px; font-weight: 600;
  letter-spacing: 0.22em; text-transform: uppercase;
  display: flex; align-items: center; gap: 14px; cursor: pointer;
  color: var(--cream);
}
.brand-signal {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--signal); box-shadow: 0 0 10px var(--signal);
  animation: pulse 2.4s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.8)} }
.brand-title span { color: var(--gold); }
.hdr-actions { display: flex; align-items: center; gap: 6px; }
.hdr-btn {
  font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted); background: none; border: 1px solid var(--border);
  padding: 5px 12px; border-radius: 2px; cursor: pointer;
  text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
  transition: all 0.2s;
}
.hdr-btn:hover { color: var(--gold); border-color: var(--gold); background: var(--gold-dim); }
.hdr-btn svg { display: block; }

/* ═══ SIDEBAR ═══ */
#sidebar { border-right: 1px solid var(--border); background: var(--surface); }
.side-head { padding: 20px 20px 16px; border-bottom: 1px solid var(--border); }
.side-date { font-family: var(--serif); font-size: 28px; font-weight: 900; line-height: 1; color: var(--cream); margin-bottom: 4px; }
.side-month { font-family: var(--mono); font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
.side-search { padding: 14px 20px; border-bottom: 1px solid var(--border); }
#searchInput {
  width: 100%; height: 34px; padding: 0 12px;
  font-family: var(--mono); font-size: 11px;
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--cream); border-radius: 2px; transition: border-color 0.2s;
}
#searchInput:focus { outline: none; border-color: var(--gold); }
#searchInput::placeholder { color: var(--faint); }
#searchStatus { font-family: var(--mono); font-size: 9px; color: var(--faint); margin-top: 6px; min-height: 12px; }

.chips { display: flex; flex-wrap: wrap; gap: 5px; padding: 14px 20px; border-bottom: 1px solid var(--border); }
.chip {
  font-family: var(--mono); font-size: 9px; letter-spacing: 0.06em;
  padding: 4px 9px; border-radius: 2px; cursor: pointer;
  border: 1px solid var(--border); background: none; color: var(--muted);
  transition: all 0.15s; white-space: nowrap;
}
.chip:hover { border-color: var(--gold); color: var(--gold); }
.chip.active { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }

#nav { flex: 1; overflow-y: auto; padding: 8px 0; }
.month-hdr {
  font-family: var(--mono); font-size: 9px; font-weight: 600;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--faint); padding: 10px 20px 6px; cursor: pointer;
  display: flex; align-items: center; gap: 8px;
  transition: color 0.15s; user-select: none;
}
.month-hdr:hover { color: var(--muted); }
.month-hdr.lit { color: var(--gold); }
.month-hdr .arr { font-size: 7px; transition: transform 0.2s; }
.month-group.open .month-hdr .arr { transform: rotate(90deg); }
.month-body { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
.month-group.open .month-body { max-height: 9999px; }

.date-hdr {
  font-family: var(--mono); font-size: 11px; font-weight: 500;
  color: var(--muted); padding: 6px 20px 6px 28px; cursor: pointer;
  display: flex; align-items: center; gap: 8px;
  transition: color 0.15s; user-select: none;
}
.date-hdr:hover { color: var(--cream); }
.date-hdr.lit { color: var(--gold); }
.date-hdr.search-hit { color: var(--gold); background: var(--gold-dim); }
.date-hdr .arr { font-size: 7px; transition: transform 0.2s; }
.date-group.open .date-hdr .arr { transform: rotate(90deg); }
.rpt-list { max-height: 0; overflow: hidden; transition: max-height 0.25s ease; }
.date-group.open .rpt-list { max-height: 800px; }

.rpt-item {
  display: flex; align-items: center; gap: 10px;
  padding: 5px 20px 5px 36px; cursor: pointer; transition: background 0.1s;
}
.rpt-item:hover { background: var(--surface-2); }
.rpt-item.active { background: var(--gold-dim); }
.rpt-item.active .rpt-name { color: var(--gold); }
.rpt-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; opacity: 0.8; }
.rpt-name { font-family: var(--mono); font-size: 10px; color: var(--muted); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rpt-langs { display: flex; gap: 3px; }
.lang-btn {
  font-family: var(--mono); font-size: 8px; letter-spacing: 0.08em;
  padding: 2px 6px; border-radius: 2px; cursor: pointer;
  border: 1px solid var(--border); background: none; color: var(--faint);
  transition: all 0.12s;
}
.lang-btn:hover { border-color: var(--muted); color: var(--muted); }
.lang-btn.active { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }

/* ═══ MAIN ═══ */
#main { background: var(--ink); }
#content { max-width: 880px; margin: 0 auto; padding: 48px 56px 96px; }

/* ═══ DASHBOARD ═══ */
.dash { animation: rise 0.5s cubic-bezier(0.16,1,0.3,1); }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

.dash-masthead { margin-bottom: 48px; padding-bottom: 32px; border-bottom: 2px solid var(--cream); position: relative; }
.dash-masthead::after { content: ''; position: absolute; bottom: -5px; left: 0; right: 0; height: 1px; background: var(--border); }
.dash-kicker { font-family: var(--mono); font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold); margin-bottom: 12px; }
.dash-title { font-family: var(--serif); font-size: clamp(36px, 5vw, 56px); font-weight: 900; line-height: 1.05; letter-spacing: -0.02em; color: var(--cream); margin-bottom: 16px; }
.dash-meta { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; color: var(--muted); display: flex; gap: 24px; flex-wrap: wrap; }
.dash-meta b { color: var(--gold); font-weight: 600; }

.dash-section-label {
  font-family: var(--mono); font-size: 9px; font-weight: 600;
  letter-spacing: 0.25em; text-transform: uppercase;
  color: var(--faint); margin: 40px 0 20px;
  display: flex; align-items: center; gap: 12px;
}
.dash-section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

.dash-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); }
.dash-card {
  background: var(--surface); padding: 24px 28px;
  cursor: pointer; position: relative; transition: background 0.2s;
}
.dash-card:hover { background: var(--surface-2); }
.dash-card::before {
  content: attr(data-idx);
  position: absolute; top: 16px; right: 20px;
  font-family: var(--serif); font-size: 32px; font-weight: 900;
  color: var(--border); line-height: 1; transition: color 0.2s;
}
.dash-card:hover::before { color: var(--gold-dim); }
.dash-card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.dash-card-dot { width: 6px; height: 6px; border-radius: 50%; }
.dash-card-title { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--cream-dim); }
.dash-card-arrow { margin-left: auto; font-family: var(--mono); font-size: 9px; color: var(--faint); opacity: 0; transition: opacity 0.2s; }
.dash-card:hover .dash-card-arrow { opacity: 1; color: var(--gold); }
.dash-card ul { list-style: none; }
.dash-card li { font-family: var(--body); font-size: 13px; line-height: 1.6; color: var(--muted); padding: 3px 0 3px 16px; position: relative; }
.dash-card li::before { content: '—'; position: absolute; left: 0; color: var(--faint); }

/* ═══ MARKDOWN ═══ */
.md { font-family: var(--body); font-size: 16px; line-height: 1.9; color: var(--cream); animation: rise 0.4s cubic-bezier(0.16,1,0.3,1); }
.md h1 { font-family: var(--serif); font-size: 28px; font-weight: 900; margin-bottom: 24px; line-height: 1.2; }
.md h2 { font-family: var(--serif); font-size: 20px; font-weight: 700; margin: 40px 0 16px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.md h3 { font-family: var(--serif); font-size: 17px; font-weight: 700; margin: 28px 0 10px; }
.md h4 { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; margin: 20px 0 8px; color: var(--muted); }
.md p { margin-bottom: 14px; }
.md a { color: var(--gold); text-decoration: none; border-bottom: 1px solid var(--gold-dim); transition: border-color 0.15s; }
.md a:hover { border-color: var(--gold); }
.md strong { font-weight: 600; color: var(--cream); }
.md hr { border: none; height: 1px; background: var(--border); margin: 32px 0; }
.md ul, .md ol { padding-left: 24px; margin-bottom: 14px; }
.md li { margin-bottom: 5px; }
.md blockquote { border-left: 3px solid var(--gold); padding: 12px 20px; margin: 18px 0; background: var(--gold-dim); font-style: italic; color: var(--cream-dim); }
.md code { font-family: var(--mono); font-size: 12px; background: var(--surface-2); border: 1px solid var(--border); padding: 2px 6px; border-radius: 2px; }
.md pre { background: var(--surface); border: 1px solid var(--border); padding: 18px; overflow-x: auto; margin: 16px 0; border-radius: 2px; }
.md pre code { background: none; border: none; padding: 0; }
.md table { width: 100%; border-collapse: collapse; margin: 18px 0; font-size: 13px; }
.md th { font-family: var(--mono); font-size: 9px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; background: var(--surface-2); border: 1px solid var(--border); padding: 9px 14px; color: var(--muted); text-align: left; }
.md td { border: 1px solid var(--border); padding: 9px 14px; vertical-align: top; font-size: 13px; }
.md tr:nth-child(even) td { background: var(--surface); }
.md details { border: 1px solid var(--border); margin: 12px 0; border-radius: 2px; overflow: hidden; }
.md summary { cursor: pointer; padding: 10px 16px; font-family: var(--mono); font-size: 11px; color: var(--muted); background: var(--surface-2); user-select: none; list-style: none; display: flex; align-items: center; gap: 8px; }
.md summary::-webkit-details-marker { display: none; }
.md summary::before { content: '▸'; font-size: 9px; }
.md details[open] summary::before { content: '▾'; }
.md details > *:not(summary) { padding: 14px 16px; }

/* ═══ MSG ═══ */
.msg { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; height: 280px; }
.msg-icon { font-size: 32px; opacity: 0.3; }
.msg-text { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; color: var(--faint); }

/* ═══ KBD OVERLAY ═══ */
#kbd-overlay { display: none; position: fixed; inset: 0; z-index: 999; background: rgba(0,0,0,0.7); backdrop-filter: blur(6px); align-items: center; justify-content: center; }
#kbd-overlay.show { display: flex; }
.kbd-panel { background: var(--surface); border: 1px solid var(--border); padding: 32px 36px; min-width: 300px; }
.kbd-panel h3 { font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); margin-bottom: 20px; }
.kbd-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--border); }
.kbd-row:last-child { border: none; }
.kbd-row span { font-family: var(--body); font-size: 12px; color: var(--muted); }
.kbd-key { font-family: var(--mono); font-size: 10px; background: var(--surface-2); border: 1px solid var(--border); padding: 3px 8px; color: var(--cream); }

/* ═══ MOBILE ═══ */
#mob-toggle { display: none; }
@media (max-width: 860px) {
  #app { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; }
  #sidebar { grid-row: 2; max-height: 48px; overflow: hidden; border-right: none; border-bottom: 1px solid var(--border); transition: max-height 0.3s ease; }
  #sidebar.open { max-height: 55vh; overflow-y: auto; }
  #main { grid-row: 3; }
  #mob-toggle { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 20px; cursor: pointer; font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; color: var(--muted); }
  .side-head, .side-search, .chips, #nav { display: none; }
  #sidebar.open .side-head, #sidebar.open .side-search, #sidebar.open #nav { display: block; }
  #sidebar.open .chips { display: flex; }
  #content { padding: 28px 20px 64px; }
  .dash-grid { grid-template-columns: 1fr; }
  .dash-title { font-size: 32px; }
  .hdr-actions .hdr-btn:not(#themeBtn):not(#kbdBtn) { display: none; }
}
</style>
</head>
<body>
<div id="app">
  <header id="hdr">
    <div class="brand" onclick="showDashboard()">
      <div class="brand-signal"></div>
      <div class="brand-title">AGENTS<span>·</span>RADAR</div>
    </div>
    <div class="hdr-actions">
      <a class="hdr-btn" href="https://github.com/duanyytop/agents-radar" target="_blank" rel="noopener">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        SRC
      </a>
      <a class="hdr-btn" href="./feed.xml">RSS</a>
      <button class="hdr-btn" id="kbdBtn">?</button>
      <button class="hdr-btn" id="themeBtn">◐</button>
    </div>
  </header>

  <aside id="sidebar">
    <div id="mob-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰ NAVIGATE</div>
    <div class="side-head">
      <div class="side-date" id="sideDate">—</div>
      <div class="side-month" id="sideMonth">INTELLIGENCE BRIEFING</div>
    </div>
    <div class="side-search">
      <input id="searchInput" type="search" placeholder="SEARCH ARCHIVE  [ / ]">
      <div id="searchStatus"></div>
    </div>
    <div class="chips" id="chips"></div>
    <div id="nav"></div>
  </aside>

  <main id="main">
    <div id="content"><div class="msg"><div class="msg-icon">◉</div><div class="msg-text">ESTABLISHING UPLINK…</div></div></div>
  </main>
</div>

<div id="kbd-overlay" onclick="this.classList.remove('show')">
  <div class="kbd-panel" onclick="event.stopPropagation()">
    <h3>Keyboard Protocol</h3>
    <div class="kbd-row"><span>Dashboard</span><span class="kbd-key">D</span></div>
    <div class="kbd-row"><span>Search</span><span class="kbd-key">/</span></div>
    <div class="kbd-row"><span>Next report</span><span class="kbd-key">J</span></div>
    <div class="kbd-row"><span>Prev report</span><span class="kbd-key">K</span></div>
    <div class="kbd-row"><span>Toggle ZH/EN</span><span class="kbd-key">L</span></div>
    <div class="kbd-row"><span>Theme</span><span class="kbd-key">T</span></div>
    <div class="kbd-row"><span>This panel</span><span class="kbd-key">?</span></div>
    <div class="kbd-row"><span>Dismiss</span><span class="kbd-key">ESC</span></div>
  </div>
</div>

<script>
marked.use({ breaks: true, gfm: true });
DOMPurify.addHook('uponSanitizeElement', (n, d) => { if (d.tagName==='details'||d.tagName==='summary') d.allowedTags[d.tagName]=true; });
const renderMd = raw => DOMPurify.sanitize(marked.parse(raw), { ADD_TAGS:['details','summary'], ADD_ATTR:['open'] });

const SOURCES = {
  'ai-cli':      { label:'CLI Tools',    color:'var(--blue)' },
  'ai-agents':   { label:'Agents',       color:'var(--purple)' },
  'ai-web':      { label:'Web Watch',    color:'var(--cyan)' },
  'ai-trending': { label:'Trending',     color:'var(--green)' },
  'ai-hn':       { label:'Hacker News',  color:'var(--orange)' },
  'ai-ph':       { label:'Product Hunt', color:'var(--pink)' },
  'ai-arxiv':    { label:'ArXiv',        color:'var(--red)' },
  'ai-hf':       { label:'HuggingFace',  color:'var(--purple)' },
  'ai-community':{ label:'Community',    color:'var(--cyan)' },
  'ai-weekly':   { label:'Weekly',       color:'var(--gold)' },
  'ai-monthly':  { label:'Monthly',      color:'var(--gold)' },
};

let dates = [], currentKey = null, highlights = null;
let searchIndex = null, searchReady = false, searchQuery = '', searchTimer = null, activeFilter = null;

const themeBtn = document.getElementById('themeBtn');
let theme = localStorage.getItem('ar-theme') || 'dark';
function applyTheme(t) { theme=t; document.documentElement.dataset.theme=t; themeBtn.textContent=t==='dark'?'◐':'●'; localStorage.setItem('ar-theme',t); }
applyTheme(theme);
themeBtn.onclick = () => applyTheme(theme==='dark'?'light':'dark');

(function buildChips(){
  const wrap = document.getElementById('chips');
  const all = document.createElement('button'); all.className='chip active'; all.textContent='ALL';
  all.onclick = () => setFilter(null);
  wrap.appendChild(all);
  Object.entries(SOURCES).forEach(([k,v]) => {
    if (k==='ai-weekly'||k==='ai-monthly') return;
    const c = document.createElement('button'); c.className='chip'; c.textContent=v.label; c.dataset.src=k;
    c.onclick = () => setFilter(k);
    wrap.appendChild(c);
  });
})();
function setFilter(src) {
  activeFilter = src;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', src ? c.dataset.src===src : !c.dataset.src));
  document.querySelectorAll('.date-group').forEach(g => {
    if (!src) { g.style.display=''; return; }
    g.style.display = g.querySelector(`[data-key$="/${src}"],[data-key$="/${src}-en"]`) ? '' : 'none';
  });
}

const searchInput = document.getElementById('searchInput');
const searchStatus = document.getElementById('searchStatus');
function applySearch(q) {
  const n = q.trim().toLowerCase(); let hits=0;
  document.querySelectorAll('.date-group').forEach(g => {
    const h = g.querySelector('.date-hdr');
    if (!n||!searchIndex) { h.classList.remove('search-hit'); return; }
    const m = (searchIndex.get(g.dataset.date)||'').includes(n);
    h.classList.toggle('search-hit', m); if(m) hits++;
  });
  searchStatus.textContent = !n ? '' : !searchReady ? 'INDEXING…' : `${hits} MATCHES`;
}
async function buildIndex() {
  const idx = new Map(); dates.forEach(({date})=>idx.set(date,''));
  const tasks=[]; dates.forEach(({date,reports})=>reports.forEach(r=>tasks.push({date,r})));
  const chunks = new Map(dates.map(({date})=>[date,[]]));
  let i=0;
  const w = async()=>{ while(i<tasks.length){ const {date,r}=tasks[i++]; try{ const res=await fetch(`./digests/${date}/${r}.md`); if(res.ok) chunks.get(date).push(await res.text()); }catch{} } };
  await Promise.all(Array.from({length:6},w));
  chunks.forEach((a,d)=>idx.set(d,a.join('\n').toLowerCase()));
  return idx;
}
searchInput.addEventListener('input', ()=>{ searchQuery=searchInput.value; clearTimeout(searchTimer); searchTimer=setTimeout(()=>applySearch(searchQuery),120); });

const setContent = html => { document.getElementById('content').innerHTML = html; };

function showDashboard() {
  currentKey = null;
  history.pushState(null,'','#dashboard');
  document.querySelectorAll('.rpt-item,.lang-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('main').scrollTop = 0;

  const latest = dates[0];
  const d = latest ? latest.date : '—';
  const cnt = latest ? latest.reports.filter(r=>!r.endsWith('-en')).length : 0;

  if (latest) {
    document.getElementById('sideDate').textContent = d.slice(8);
    document.getElementById('sideMonth').textContent = d.slice(0,7).replace('-',' · ');
  }

  let cards = '';
  if (highlights && highlights.zh) {
    let idx = 1;
    Object.entries(highlights.zh).forEach(([key, items]) => {
      const meta = SOURCES[key] || { label:key, color:'var(--gold)' };
      const hasReport = latest && latest.reports.includes(key);
      cards += `<div class="dash-card" data-idx="${String(idx).padStart(2,'0')}" ${hasReport?`onclick="loadReport('${d}','${key}')"`:''}>
        <div class="dash-card-head">
          <div class="dash-card-dot" style="background:${meta.color}"></div>
          <div class="dash-card-title">${meta.label}</div>
          <div class="dash-card-arrow">READ →</div>
        </div>
        <ul>${items.slice(0,5).map(i=>`<li>${i}</li>`).join('')}</ul>
      </div>`;
      idx++;
    });
  }

  setContent(`<div class="dash">
    <div class="dash-masthead">
      <div class="dash-kicker">Daily Intelligence Briefing — AI Ecosystem</div>
      <h1 class="dash-title">The Signal<br>Report</h1>
      <div class="dash-meta">
        <span>DATE <b>${d}</b></span>
        <span>SOURCES <b>${cnt}</b></span>
        <span>ARCHIVE <b>${dates.length} days</b></span>
        <span>LANG <b>ZH / EN</b></span>
      </div>
    </div>
    <div class="dash-section-label">Today's Intelligence</div>
    <div class="dash-grid">${cards || '<div class="msg"><div class="msg-icon">◉</div><div class="msg-text">NO SIGNAL DATA</div></div>'}</div>
  </div>`);
}

async function loadReport(date, report, push=true) {
  const key = `${date}/${report}`;
  if (key===currentKey) return;
  currentKey = key;
  if (push) history.pushState(null,'',`#${key}`);

  document.querySelectorAll('.rpt-item').forEach(b=>b.classList.toggle('active',b.dataset.key===key));
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.key===key));
  document.querySelectorAll('.date-group').forEach(g=>{ if(g.dataset.date===date){ g.classList.add('open'); const m=g.closest('.month-group'); if(m)m.classList.add('open'); }});
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('main').scrollTop = 0;
  setContent('<div class="msg"><div class="msg-icon">◉</div><div class="msg-text">DECRYPTING…</div></div>');

  try {
    let res;
    for (let a=0;;a++) { try { res=await fetch(`./digests/${date}/${report}.md`); break; } catch(e) { if(a>=2)throw e; await new Promise(r=>setTimeout(r,300*(a+1))); } }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    setContent(`<div class="md">${renderMd(await res.text())}</div>`);
  } catch(e) {
    setContent(`<div class="msg"><div class="msg-icon">✕</div><div class="msg-text">SIGNAL LOST: ${e.message}</div></div>`);
  }
}

function buildNav() {
  const nav = document.getElementById('nav');
  const months = new Map();
  dates.forEach(e=>{ const m=e.date.slice(0,7); if(!months.has(m))months.set(m,[]); months.get(m).push(e); });

  let first=true, firstM=true;
  months.forEach((entries, month) => {
    const mg = document.createElement('div');
    mg.className = 'month-group'+(firstM?' open':'');
    const mh = document.createElement('div');
    mh.className = 'month-hdr';
    mh.innerHTML = `<span class="arr">▸</span>${month}`;
    mh.onclick = () => mg.classList.toggle('open');
    const mb = document.createElement('div'); mb.className='month-body';

    entries.forEach(({date, reports}) => {
      const dg = document.createElement('div');
      dg.className = 'date-group'+(first?' open':'');
      dg.dataset.date = date;
      const dh = document.createElement('div');
      dh.className = 'date-hdr';
      dh.innerHTML = `<span class="arr">▸</span>${date.slice(8)}`;
      dh.onclick = () => dg.classList.toggle('open');
      const rl = document.createElement('div'); rl.className='rpt-list';

      reports.filter(r=>!r.endsWith('-en')).forEach(r => {
        const meta = SOURCES[r]||{label:r,color:'var(--muted)'};
        const hasEn = reports.includes(r+'-en');
        const item = document.createElement('div');
        item.className = 'rpt-item'; item.dataset.key = `${date}/${r}`;
        item.innerHTML = `<div class="rpt-dot" style="background:${meta.color}"></div><span class="rpt-name">${meta.label}</span>`;
        if (hasEn) {
          const langs = document.createElement('div'); langs.className='rpt-langs';
          const zh = document.createElement('button'); zh.className='lang-btn'; zh.textContent='ZH'; zh.dataset.key=`${date}/${r}`;
          zh.onclick = e => { e.stopPropagation(); loadReport(date,r); };
          const en = document.createElement('button'); en.className='lang-btn'; en.textContent='EN'; en.dataset.key=`${date}/${r}-en`;
          en.onclick = e => { e.stopPropagation(); loadReport(date,r+'-en'); };
          langs.append(zh,en); item.appendChild(langs);
        }
        item.onclick = () => loadReport(date, r);
        rl.appendChild(item);
      });

      dg.append(dh, rl); mb.appendChild(dg); first=false;
    });

    mg.append(mh, mb); nav.appendChild(mg); firstM=false;
  });
}

function allKeys() { const k=[]; dates.forEach(({date,reports})=>reports.filter(r=>!r.endsWith('-en')).forEach(r=>k.push({date,report:r}))); return k; }
function navReport(dir) {
  const keys=allKeys(); if(!keys.length)return;
  if(!currentKey||currentKey==='dashboard'){loadReport(keys[0].date,keys[0].report);return;}
  const [d,r]=currentKey.split('/');
  const i=keys.findIndex(k=>k.date===d&&k.report===r);
  const n=i+dir;
  if(n>=0&&n<keys.length)loadReport(keys[n].date,keys[n].report);
}
function toggleLang() {
  if(!currentKey||currentKey==='dashboard')return;
  const [d,r]=currentKey.split('/');
  const entry=dates.find(x=>x.date===d); if(!entry)return;
  if(r.endsWith('-en')){if(entry.reports.includes(r.replace('-en','')))loadReport(d,r.replace('-en',''));}
  else{if(entry.reports.includes(r+'-en'))loadReport(d,r+'-en');}
}
document.addEventListener('keydown', e => {
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'){if(e.key==='Escape')e.target.blur();return;}
  const ov=document.getElementById('kbd-overlay');
  if(e.key==='Escape'){ov.classList.remove('show');return;}
  if(e.key==='?'){ov.classList.toggle('show');return;}
  if(ov.classList.contains('show'))return;
  switch(e.key.toLowerCase()){
    case 'd':showDashboard();break;
    case '/':e.preventDefault();searchInput.focus();break;
    case 'j':navReport(1);break;
    case 'k':navReport(-1);break;
    case 'l':toggleLang();break;
    case 't':applyTheme(theme==='dark'?'light':'dark');break;
  }
});
document.getElementById('kbdBtn').onclick=()=>document.getElementById('kbd-overlay').classList.toggle('show');

function getHash(){const h=location.hash.slice(1);if(h==='dashboard')return{dash:true};const[d,r]=h.split('/');return/^\d{4}-\d{2}-\d{2}$/.test(d)&&r?{date:d,report:r}:null;}
window.addEventListener('popstate',()=>{const h=getHash();if(h&&h.dash)showDashboard();else if(h)loadReport(h.date,h.report,false);});

(async()=>{
  try {
    const res = await fetch('./manifest.json');
    if(!res.ok) throw new Error('manifest.json not found');
    const data = await res.json();
    if(!data.dates?.length) throw new Error('empty manifest');
    dates = data.dates;
    buildNav();

    try { const hr=await fetch(`./digests/${dates[0].date}/highlights.json`); if(hr.ok) highlights=await hr.json(); } catch{}

    const hash = getHash();
    if(hash&&!hash.dash&&dates.find(d=>d.date===hash.date&&d.reports.includes(hash.report))) await loadReport(hash.date,hash.report,false);
    else showDashboard();

    searchReady=false; searchStatus.textContent='INDEXING…';
    buildIndex().then(idx=>{searchIndex=idx;searchReady=true;applySearch(searchQuery);if(!searchQuery.trim())searchStatus.textContent='';});
  } catch(e) {
    document.getElementById('nav').innerHTML=`<div class="msg" style="height:60px"><div class="msg-text">ERROR: ${e.message}</div></div>`;
    setContent('<div class="msg"><div class="msg-icon">✕</div><div class="msg-text">MANIFEST FAILURE</div></div>');
  }
})();
</script>
